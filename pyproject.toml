[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "LCLSGeom"
version = "0.2.0"
description = "Miscellaneous functions for converting geometry files for LCLS geometry calibrations and optimizations."
readme = "README.md"
authors = [
    { name="Louis Conreux", email="louis.conreux1@gmail.com" }
]
license = { file = "LICENSE" }
requires-python = ">=3.6"
dependencies = [
    "numpy>=1.20.0",
    "pyFAI>=0.20.0",
]

classifiers = [
    "Programming Language :: Python :: 3",
    "License :: Other/Proprietary License",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/LouConreux/LCLSGeom"

[project.scripts]
lcls-convert = "LCLSGeom.scripts.convert:main"
lcls-push-db = "LCLSGeom.scripts.push_to_database:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
"LCLSGeom" = ["templates/*"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["LCLSGeom", "LCLSGeom.*"]
namespaces = false

[tool.pytest.ini_options]
testpaths = ["tests"]
